name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint the skills
        run: node tools/lint-skills.mjs

      # Static checks of the manifests and the skills' frontmatter: no Claude credentials needed.
      - name: Validate the plugin and the marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.301 plugin validate ./plugins/web-guardrails --strict
          npx --yes @anthropic-ai/claude-code@2.1.301 plugin validate . --strict
